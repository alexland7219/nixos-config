config_version = 14

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.5
center = [ "date" ]
end = [
    "tray",
    "volume",
    "clipboard",
    "network",
    "bluetooth",
    "brightness",
    "battery",
    "control-center",
    "notifications",
    "clock",
    "session"
]
font_weight = 600
margin_ends = 0
radius = 0
scale = 1.15
shadow = false
start = [ "wallpaper", "workspaces", "spacer_3" ]

[control_center]
width = 730

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Barcelona, Spain"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
history_retention_hours = 6

[shell]
font_family = "Nunito"

    [shell.panel]
    control_center_placement = "floating"

[theme]
builtin = "Gruvbox"
community_palette = "Everforest"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "niri", "gtk4", "qt" ]

[wallpaper.default]
path = "/home/alex/Pictures/disco.png"

[wallpaper.last]
path = "/home/alex/Pictures/disco.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/alex/Pictures/disco.png"

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.date]
format = "{:%A, %d %B}"

[widget.media]
max_length = 350

[widget.spacer_3]
type = "spacer"

[widget.workspaces]
change_color_on_hover = false
pill_scale = 0.8
show_labels = false